[project]
name = "savontanalysis"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "pandas",
]

[project.scripts]
savont-analyse = "savontanalysis.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]